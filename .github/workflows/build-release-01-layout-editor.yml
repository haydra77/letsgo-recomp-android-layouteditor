name: Build Release 0.1 + Touch Layout Editor

on:
  push:
    branches:
      - experiment/release-0.1-touch-layout-editor
    paths:
      - ".github/workflows/build-release-01-layout-editor.yml"
      - "apk/java/com/letsgorecomp/GamepadOverlay.java"
      - "apk/java/com/letsgorecomp/TouchLayoutEditor.java"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: experiment/release-0.1-touch-layout-editor

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Download Release 0.1 APK and smali tools
        run: |
          mkdir -p tools work
          curl -fL --retry 3 \
            "https://github.com/CowKillers/letsgo-recomp-android/releases/download/v0.1/LetsGoLauncher-v0118.apk" \
            -o work/release-0.1.apk
          curl -fL --retry 3 \
            "https://github.com/baksmali/smali/releases/download/v3.0.10/baksmali-3.0.10-fat-release.jar" \
            -o tools/baksmali.jar
          curl -fL --retry 3 \
            "https://github.com/baksmali/smali/releases/download/v3.0.10/smali-3.0.10-fat-release.jar" \
            -o tools/smali.jar
          test -s work/release-0.1.apk
          test -s tools/baksmali.jar
          test -s tools/smali.jar
          unzip -l work/release-0.1.apk | grep -E 'classes([0-9]+)?\\.dex'

      - name: Compile only the touch overlay Java classes
        run: |
          mkdir -p work/stubs/com/letsgorecomp work/classes work/dex
          cat > work/stubs/com/letsgorecomp/LetsGoActivity.java <<'EOF'
          package com.letsgorecomp;
          public class LetsGoActivity {
              public static native double nativeGetFps();
              public static native double nativeGetFrameMs();
              public static native void nativeSetButton(int button, boolean down);
              public static native void nativeSetStick(int stickId, int x, int y);
          }
          EOF
          cat > work/stubs/com/letsgorecomp/LetsGoLauncherActivity.java <<'EOF'
          package com.letsgorecomp;
          import android.app.Activity;
          public class LetsGoLauncherActivity {
              public static String gameDir(Activity activity) { return null; }
          }
          EOF
          javac -source 8 -target 8 \
            -bootclasspath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d work/classes \
            work/stubs/com/letsgorecomp/LetsGoActivity.java \
            work/stubs/com/letsgorecomp/LetsGoLauncherActivity.java \
            apk/java/com/letsgorecomp/GamepadOverlay.java \
            apk/java/com/letsgorecomp/TouchLayoutEditor.java
          find work/classes/com/letsgorecomp -maxdepth 1 -type f \
            \( -name 'GamepadOverlay*.class' -o -name 'TouchLayoutEditor*.class' \) \
            > work/classes-to-dex.txt
          test -s work/classes-to-dex.txt
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 28 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output work/dex @work/classes-to-dex.txt
          test -s work/dex/classes.dex

      - name: Replace only GamepadOverlay classes in Release 0.1 DEX
        run: |
          mkdir -p work/base-smali work/new-smali work/apk
          unzip -p work/release-0.1.apk classes.dex > work/original-classes.dex
          java -jar tools/baksmali.jar disassemble work/original-classes.dex -o work/base-smali
          java -jar tools/baksmali.jar disassemble work/dex/classes.dex -o work/new-smali
          test -f work/base-smali/com/letsgorecomp/GamepadOverlay.smali
          find work/base-smali/com/letsgorecomp -maxdepth 1 -type f \
            \( -name 'GamepadOverlay*.smali' -o -name 'TouchLayoutEditor*.smali' \) -delete
          find work/new-smali/com/letsgorecomp -maxdepth 1 -type f \
            \( -name 'GamepadOverlay*.smali' -o -name 'TouchLayoutEditor*.smali' \) \
            -exec cp {} work/base-smali/com/letsgorecomp/ \;
          java -jar tools/smali.jar assemble work/base-smali -o work/patched-classes.dex
          test -s work/patched-classes.dex

      - name: Repackage APK and sign
        run: |
          mkdir -p work/unpacked
          unzip -q work/release-0.1.apk -d work/unpacked
          cp work/patched-classes.dex work/unpacked/classes.dex
          rm -f work/unpacked/META-INF/*.RSA work/unpacked/META-INF/*.DSA \
                work/unpacked/META-INF/*.EC work/unpacked/META-INF/*.SF \
                work/unpacked/META-INF/*.MF
          (cd work/unpacked && zip -X -q -r ../unsigned.apk .)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            work/unsigned.apk work/aligned.apk
          keytool -genkeypair -v \
            -keystore work/layout-editor-release.keystore \
            -storepass "layout-editor-temp-pass" \
            -keypass "layout-editor-temp-pass" \
            -alias layout-editor \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Let's Go Recomp Layout Editor"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks work/layout-editor-release.keystore \
            --ks-key-alias layout-editor \
            --ks-pass pass:layout-editor-temp-pass \
            --key-pass pass:layout-editor-temp-pass \
            --out work/LetsGo-Release-0.1-TouchLayoutEditor.apk \
            work/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            work/LetsGo-Release-0.1-TouchLayoutEditor.apk
          sha256sum work/LetsGo-Release-0.1-TouchLayoutEditor.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LetsGo-Release-0.1-TouchLayoutEditor
          path: work/LetsGo-Release-0.1-TouchLayoutEditor.apk
          if-no-files-found: error
          retention-days: 30
